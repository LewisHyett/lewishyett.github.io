<header class="top">
  <div class="wrapper top__inner">
    <a class="top__logo" rel="author" href="{{ '/' | relative_url }}">{{ site.author_name | default: site.title }}</a>
    <nav aria-label="Main">
      <ul class="top__nav">
        {%- for path in site.header_pages -%}
          {%- assign my_page = site.pages | where: "path", path | first -%}
          {%- if my_page.title -%}
            <li><a href="{{ my_page.url | relative_url }}"{% if page.url == my_page.url %} aria-current="page"{% endif %}>{{ my_page.nav_title | default: my_page.title | escape }}</a></li>
          {%- endif -%}
        {%- endfor -%}
      </ul>
    </nav>
  </div>
</header>
