title: Lewis Hyett — Business Central Notes
email: lewishyett467@gmail.com
description: >-
  Notes on Business Central, AL development, and whatever else is on my mind.
baseurl: ""
url: "https://lewishyett.github.io"
github_username: lewishyett
author_name: Lewis Hyett

# Display names for post categories (the front matter uses slugs)
category_names:
  devops: DevOps
  business-central: Business Central

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

minima:
  date_format: "%b %-d, %Y"
  social_links:
    github: lewishyett

header_pages:
  - posts.html
  - search.html
  - about.md

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
